<!DOCTYPE html>
<html lang="sv">
<!-- Requested: a fancy, cute, animated romantic page that says "du är bäst sötis" with a heart.
     Follow-up requests: address the page to Saranda by name, make the animation work in
     Safari on iPhone, and add some cute music.
     Later report from the user: on their iPhone the music played, but the heart did not
     beat and the background did not move.
     iOS notes: the drifting hearts, sparkles and burst are driven by the Web Animations API
     instead of CSS keyframes that read custom properties, because WebKit resolves var()
     inside @keyframes unreliably. The music is synthesised with Web Audio and only starts
     from a tap, since iOS blocks autoplay with sound. A phone asking for reduced motion
     now gets a calm version of the scene rather than a still one, the ambient layers no
     longer ask for fifty compositor layers, and if an animation does not advance on the
     device, a frame loop draws the scene instead. Opening the page with ?debug=1 shows
     what the phone is really doing. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0f2e">
<title>Du är bäst, sötis</title>
<meta name="description" content="En liten kärleksfull sida till Saranda.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 92'%3E%3Cpath d='M50 90C50 90 4 62 4 32 4 15 17 4 31 4c9 0 16 5 19 12 3-7 10-12 19-12 14 0 27 11 27 28 0 30-46 58-46 58z' fill='%23ff7ab3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint: a render-blocking stylesheet leaves the page
     blank on a slow phone connection, and the fallback stack reads fine in the meantime. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap"></noscript>
<style>
/* Scene: a glowing, beating heart in a rose dusk sky, with small hearts drifting upward behind it. */
:root{
  --night:#2b0f2e;
  --night-mid:#56143f;
  --night-low:#190a1d;
  --rose:#ff7ab3;
  --rose-deep:#e23a7c;
  --blush:#ffd8e8;
  --cream:#fff5f9;
  --gold:#ffd690;
  --soft:rgba(255,245,249,.74);
  --font-display:"Pacifico","Snell Roundhand","Segoe Script",cursive;
  --font-body:"Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--cream);
  background:
    radial-gradient(115% 80% at 50% -5%, #6d1a4c 0%, rgba(109,26,76,0) 62%),
    radial-gradient(95% 70% at 12% 102%, #8a2152 0%, rgba(138,33,82,0) 58%),
    linear-gradient(180deg, var(--night) 0%, var(--night-mid) 52%, var(--night-low) 100%);
  background-attachment:scroll;
  background-color:var(--night);
  overflow-x:hidden;
}

/* Ambient layers. Both are painted behind the content and never take taps. */
#sky,#burst{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#sky{z-index:0}
#burst{z-index:3}
/* No will-change and no translateZ() here on purpose. Each one asks for its own
   compositor layer, and about fifty of them at once is enough for Safari on an iPhone
   to run out of layer memory and stop painting the moving tiles, which looks exactly
   like the frozen background the user reported. An animated transform gets promoted
   when it genuinely needs it. */
.float-heart,.pop,.spark{position:absolute;top:0;left:0}
.float-heart svg,.pop svg,.spark svg{display:block;width:100%;height:auto;fill:currentColor}

/* Content */
.stage{
  position:relative;z-index:1;
  width:100%;max-width:40rem;
  min-height:100vh;
  min-height:100svh;
  margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(clamp(1.5rem,5vh,3rem),env(safe-area-inset-top,0px));
  padding-bottom:max(clamp(1.5rem,5vh,3rem),env(safe-area-inset-bottom,0px));
  text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1.1rem,3.4vh,2rem);
}
.eyebrow{
  margin:0;font-size:.78rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;
  color:var(--blush);opacity:.85;
  animation:fadeUp .7s ease-out both
}
.title{
  margin:0;font-family:var(--font-display);font-weight:400;line-height:1.04;
  font-size:clamp(2.6rem,11.5vw,5rem);text-wrap:balance;
  -webkit-filter:drop-shadow(0 0 26px rgba(255,122,179,.4));
  filter:drop-shadow(0 0 26px rgba(255,122,179,.4));
  animation:fadeUp .8s .06s ease-out both
}
.title span{
  display:block;
  background-image:linear-gradient(100deg,var(--blush) 0%,var(--rose) 45%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
/* If a browser cannot clip a gradient to text, show solid pink instead of nothing. */
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .title span{-webkit-text-fill-color:var(--blush);color:var(--blush)}
}
.title .big{font-size:1.24em;margin-top:.06em}

.heart-btn{
  -webkit-appearance:none;appearance:none;border:0;background:none;padding:0;margin:0;
  cursor:pointer;display:block;line-height:0;
  width:clamp(9rem,42vw,14rem);max-width:100%;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  color:inherit;
  animation:fadeUp .8s .12s ease-out both
}
.heart-wrap .glow{
  position:absolute;inset:-20%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,122,179,.5) 0%,rgba(255,122,179,0) 68%);
  animation:halo 1.6s ease-in-out infinite;pointer-events:none
}
.heart-wrap{
  position:relative;display:block;
  -webkit-transition:-webkit-transform .12s ease;transition:transform .12s ease
}
/* Requested: make the animation work in Safari on iPhone. The press feedback used to
   set animation:none on the heart itself, which can leave it standing still after a
   tap. The wrapper is scaled instead, so the beat underneath keeps running. */
.heart-wrap.pressing{-webkit-transform:scale(.94);transform:scale(.94)}
.heart-btn svg{
  display:block;width:100%;height:auto;position:relative;
  animation:beat 1.6s ease-in-out infinite;
  -webkit-transform-origin:50% 60%;transform-origin:50% 60%
}
.heart-btn:focus-visible{outline:3px solid var(--gold);outline-offset:14px;border-radius:24px}
@keyframes beat{
  0%{-webkit-transform:scale(1);transform:scale(1)}
  14%{-webkit-transform:scale(1.09);transform:scale(1.09)}
  28%{-webkit-transform:scale(1);transform:scale(1)}
  42%{-webkit-transform:scale(1.05);transform:scale(1.05)}
  60%,100%{-webkit-transform:scale(1);transform:scale(1)}
}
@keyframes halo{
  0%,100%{opacity:.5;-webkit-transform:scale(.96);transform:scale(.96)}
  30%{opacity:.95;-webkit-transform:scale(1.06);transform:scale(1.06)}
}
@keyframes fadeUp{
  from{opacity:0;-webkit-transform:translateY(14px);transform:translateY(14px)}
  to{opacity:1;-webkit-transform:none;transform:none}
}
/* Calm versions, used when the phone asks for reduced motion. The point is to settle
   the page down, not to switch it off: a slow shallow pulse and a plain fade. */
@keyframes beat-calm{
  0%,100%{-webkit-transform:scale(1);transform:scale(1)}
  50%{-webkit-transform:scale(1.035);transform:scale(1.035)}
}
@keyframes halo-calm{
  0%,100%{opacity:.52;-webkit-transform:scale(.99);transform:scale(.99)}
  50%{opacity:.78;-webkit-transform:scale(1.02);transform:scale(1.02)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.line{
  margin:0;min-height:3.1em;font-size:clamp(1.02rem,3.5vw,1.28rem);font-weight:500;line-height:1.55;
  color:var(--soft);max-width:26rem;
  -webkit-transition:opacity .28s ease,transform .28s ease;transition:opacity .28s ease,transform .28s ease;
  /* backwards, not both: a forwards fill keeps asserting opacity:1, which outranks
     .line.swap in the cascade and silently killed the crossfade on every tap. */
  animation:fadeUp .8s .18s ease-out backwards
}
.line.swap{opacity:0;-webkit-transform:translateY(6px);transform:translateY(6px)}

.controls{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;align-items:center;animation:fadeUp .8s .24s ease-out both}
.pill{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:inherit;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blush);background:rgba(255,216,232,.1);
  border:1px solid rgba(255,216,232,.26);border-radius:999px;padding:.58rem 1.05rem;
  margin:0
}
.pill b{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--cream)}
button.pill{
  -webkit-appearance:none;appearance:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-transition:background-color .2s ease,border-color .2s ease;transition:background-color .2s ease,border-color .2s ease
}
button.pill:hover{background:rgba(255,216,232,.18)}
button.pill[aria-pressed="true"]{background:rgba(255,122,179,.26);border-color:rgba(255,216,232,.5);color:var(--cream)}
button.pill:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.pill svg{width:1rem;height:1rem;display:block;fill:currentColor;flex:none}
.hint{margin:0;font-size:.82rem;color:var(--soft);opacity:.75}

/* The user reported a heart that did not beat and a background that did not move while
   the music played. "Reduce Motion" in iOS Accessibility settings produces exactly that,
   because this block used to switch every animation off. On a page whose whole point is
   a beating heart, the setting should calm the motion, not delete it: the beat slows down
   and shallows out, the glow breathes gently and the entrance fades without sliding. */
@media (prefers-reduced-motion: reduce){
  .heart-btn svg{animation-name:beat-calm;animation-duration:3.2s}
  .heart-wrap .glow{animation-name:halo-calm;animation-duration:3.2s}
  .heart-wrap{-webkit-transition:none;transition:none}
  .eyebrow,.title,.heart-btn,.line,.controls{animation-name:fadeIn}
  .line{-webkit-transition:opacity .28s ease;transition:opacity .28s ease}
  .line.swap{-webkit-transform:none;transform:none}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="burst" aria-hidden="true"></div>

<main class="stage">
  <p class="eyebrow">till saranda</p>

  <h1 class="title"><span>Du är bäst,</span><span class="big">sötis</span></h1>

  <span class="heart-wrap">
    <span class="glow" aria-hidden="true"></span>
    <button class="heart-btn" id="heart" type="button" aria-label="Skicka en puss">
      <svg viewBox="0 0 100 92" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="g" cx="36%" cy="26%" r="78%">
            <stop offset="0%" stop-color="#ffe3ef"/>
            <stop offset="38%" stop-color="#ff7ab3"/>
            <stop offset="100%" stop-color="#c22463"/>
          </radialGradient>
        </defs>
        <path d="M50 90C50 90 4 62 4 32 4 15 17 4 31 4c9 0 16 5 19 12 3-7 10-12 19-12 14 0 27 11 27 28 0 30-46 58-46 58z" fill="url(#g)"/>
        <path d="M26 16c-7 2-12 8-12 16" fill="none" stroke="#fff5f9" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </button>
  </span>

  <p class="line" id="line">Du gör helt vanliga dagar fina bara genom att finnas.</p>

  <div class="controls">
    <p class="pill">pussar skickade <b id="count">0</b></p>
    <button class="pill" id="music" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 3v12.2a3.3 3.3 0 1 1-2-3V7.6l-8 1.7v8.9a3.3 3.3 0 1 1-2-3V6.1z"/></svg>
      <span id="music-label">spela musik</span>
    </button>
  </div>

  <p class="hint">Tryck på hjärtat.</p>
</main>

<script>
(function(){
  'use strict';

  // The user reported that on their iPhone the music played but the heart did not beat
  // and the background did not move. Neither cause could be reproduced from here, so
  // both are covered: a phone asking for reduced motion now gets a calmer scene rather
  // than a dead one, and if the browser refuses to advance animations at all, a frame
  // loop draws the same scene instead. Which one runs is decided by measuring the page
  // on the actual device, not by sniffing the browser.
  var calm = false;
  try { calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  // Test switches, so both paths can be checked on a desktop browser too: ?calm=1 forces
  // the reduced-motion scene and ?engine=frames forces the frame loop.
  var flags = window.location.search || '';
  if (flags.indexOf('calm=1') > -1) calm = true;
  var forceFrames = flags.indexOf('engine=frames') > -1;

  var sky = document.getElementById('sky');
  var burst = document.getElementById('burst');
  var heart = document.getElementById('heart');
  var line = document.getElementById('line');
  var countEl = document.getElementById('count');
  var musicBtn = document.getElementById('music');
  var musicLabel = document.getElementById('music-label');
  var hintEl = document.querySelector('.hint');

  // Web Animations API is used instead of CSS keyframes with var(): Safari resolves custom
  // properties inside @keyframes unreliably, which left the ambient animations frozen on iPhone.
  var canAnimate = typeof document.createElement('div').animate === 'function';
  var useFrames = !canAnimate;        // true once the frame loop owns the scene
  var engine = 'starting';
  var probeMs = null, probeState = '';

  var raf = window.requestAnimationFrame ||
            function(fn){ return setTimeout(function(){ fn(Date.now()); }, 16); };

  // One frame loop for everything that the Web Animations API is not drawing. Jobs
  // return false to retire themselves, and the loop stops completely when the last one
  // goes, so an idle page costs nothing.
  var frameJobs = [];
  var looping = false;
  function addJob(fn){
    frameJobs.push(fn);
    if (!looping){ looping = true; raf(frame); }
  }
  function frame(now){
    for (var i = frameJobs.length - 1; i >= 0; i--){
      var keep = true;
      try { keep = frameJobs[i](now) !== false; } catch (e) { keep = false; }
      if (!keep) frameJobs.splice(i, 1);
    }
    if (frameJobs.length) raf(frame);
    else looping = false;
  }
  function smooth(t){ t = t < 0 ? 0 : (t > 1 ? 1 : t); return t * t * (3 - 2 * t); }

  var HEART_SVG = '<svg viewBox="0 0 100 92" aria-hidden="true" focusable="false"><path d="M50 90C50 90 4 62 4 32 4 15 17 4 31 4c9 0 16 5 19 12 3-7 10-12 19-12 14 0 27 11 27 28 0 30-46 58-46 58z"/></svg>';
  var STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2z"/></svg>';
  var TINTS = ['#ff7ab3', '#ffd8e8', '#ffd690', '#e23a7c'];

  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function vw(){ return sky.clientWidth || window.innerWidth || 360; }
  function vh(){ return sky.clientHeight || window.innerHeight || 640; }

  // --- Frame-loop drawing, used when the browser will not advance an animation --------
  function driftByFrame(el, p){
    var start = null;
    addJob(function(now){
      if (!el.parentNode) return false;
      if (start === null) start = now - p.seed;
      var k = (now - start) / p.dur;
      if (k >= 1){ el.remove(); return false; }
      var fade = k < 0.14 ? k / 0.14 : (k > 0.86 ? (1 - k) / 0.14 : 1);
      el.style.opacity = (p.op * fade).toFixed(3);
      el.style.transform = 'translate3d(' + (p.sway * k).toFixed(1) + 'px,' +
        (p.startY + (-140 - p.startY) * k).toFixed(1) + 'px,0) rotate(' +
        (p.spin * k).toFixed(1) + 'deg)';
      return true;
    });
  }

  function twinkleByFrame(el, base, phase, period){
    addJob(function(now){
      if (!el.parentNode) return false;
      var s = 0.5 - 0.5 * Math.cos((now / period + phase) * Math.PI * 2);
      el.style.opacity = (0.12 + (calm ? 0.43 : 0.78) * s).toFixed(3);
      el.style.transform = base + ' scale(' + (0.7 + (calm ? 0.3 : 0.4) * s).toFixed(3) + ')';
      return true;
    });
  }

  function popByFrame(el, p){
    var start = null;
    addJob(function(now){
      if (!el.parentNode) return false;
      if (start === null) start = now;
      var k = (now - start) / p.dur;
      if (k >= 1){ el.remove(); return false; }
      var e = 1 - Math.pow(1 - k, 3);
      el.style.opacity = k > 0.7 ? ((1 - k) / 0.3).toFixed(3) : '1';
      el.style.transform = 'translate3d(' + (p.tx * e).toFixed(1) + 'px,' + (p.ty * e).toFixed(1) +
        'px,0) scale(' + (0.4 + 0.7 * e).toFixed(3) + ') rotate(' + (p.rot * e).toFixed(1) + 'deg)';
      return true;
    });
  }

  // --- The scene ----------------------------------------------------------------------
  function makeHeart(seeded){
    var el = document.createElement('span');
    el.className = 'float-heart';
    el.innerHTML = HEART_SVG;
    var size = 10 + Math.random() * 26;
    var dur = calm ? 17000 + Math.random() * 9000 : 9000 + Math.random() * 10000;
    var startY = vh() + 30;
    var sway = (Math.random() * 80 - 40) * (calm ? 0.35 : 1);
    var spin = (Math.random() * 60 - 30) * (calm ? 0.25 : 1);
    var op = calm ? 0.2 + Math.random() * 0.2 : 0.3 + Math.random() * 0.45;
    var seed = seeded ? Math.random() * dur : 0;
    el.style.width = size.toFixed(1) + 'px';
    el.style.left = (Math.random() * Math.max(0, vw() - size)).toFixed(1) + 'px';
    el.style.color = pick(TINTS);
    sky.appendChild(el);

    if (useFrames){
      driftByFrame(el, { dur: dur, seed: seed, startY: startY, sway: sway, spin: spin, op: op });
      return;
    }

    var anim = el.animate([
      { transform: 'translate3d(0,' + startY + 'px,0) rotate(0deg)', opacity: 0 },
      { transform: 'translate3d(' + (sway * 0.35).toFixed(1) + 'px,' + (startY * 0.8).toFixed(1) + 'px,0) rotate(' + (spin * 0.3).toFixed(1) + 'deg)', opacity: op, offset: 0.14 },
      { transform: 'translate3d(' + (sway * 0.85).toFixed(1) + 'px,' + (startY * 0.18).toFixed(1) + 'px,0) rotate(' + (spin * 0.8).toFixed(1) + 'deg)', opacity: op, offset: 0.86 },
      { transform: 'translate3d(' + sway.toFixed(1) + 'px,-140px,0) rotate(' + spin.toFixed(1) + 'deg)', opacity: 0 }
    ], { duration: dur, easing: 'linear', fill: 'forwards' });

    if (seeded) { try { anim.currentTime = seed; } catch (e) {} }
    anim.onfinish = function(){ el.remove(); };
  }

  function makeSpark(){
    var el = document.createElement('span');
    el.className = 'spark';
    el.innerHTML = STAR_SVG;
    var size = 6 + Math.random() * 10;
    el.style.width = size.toFixed(1) + 'px';
    el.style.color = '#ffd690';
    var base = 'translate3d(' + (Math.random() * Math.max(0, vw() - size)).toFixed(1) + 'px,' +
               (Math.random() * Math.max(0, vh() - size)).toFixed(1) + 'px,0)';
    el.style.transform = base;
    el.style.opacity = '.35';
    sky.appendChild(el);

    var period = (calm ? 6000 : 3000) + Math.random() * 4000;
    if (useFrames){ twinkleByFrame(el, base, Math.random(), period); return; }
    el.animate([
      { opacity: 0.12, transform: base + ' scale(0.7)' },
      { opacity: calm ? 0.55 : 0.9, transform: base + ' scale(' + (calm ? 1 : 1.1) + ')' },
      { opacity: 0.12, transform: base + ' scale(0.7)' }
    ], {
      duration: period,
      iterations: Infinity,
      delay: -Math.random() * period,
      easing: 'ease-in-out'
    });
  }

  function popHearts(x, y){
    var n = calm ? 7 : 14;
    for (var i = 0; i < n; i++){
      var el = document.createElement('span');
      el.className = 'pop';
      el.innerHTML = HEART_SVG;
      var size = 12 + Math.random() * 20;
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      var dist = 70 + Math.random() * 130;
      var tx = Math.cos(ang) * dist;
      var ty = Math.sin(ang) * dist - 40;
      var rot = Math.random() * 120 - 60;
      var dur = 900 + Math.random() * 600;
      el.style.width = size.toFixed(1) + 'px';
      el.style.left = (x - size / 2).toFixed(1) + 'px';
      el.style.top = (y - size / 2).toFixed(1) + 'px';
      el.style.color = pick(TINTS);
      burst.appendChild(el);

      if (useFrames){
        popByFrame(el, { tx: tx, ty: ty, rot: rot, dur: dur });
        continue;
      }

      (function(node){
        var a = node.animate([
          { transform: 'translate3d(0,0,0) scale(.4) rotate(0deg)', opacity: 1 },
          { transform: 'translate3d(' + (tx * 0.75).toFixed(1) + 'px,' + (ty * 0.75).toFixed(1) + 'px,0) scale(1.05) rotate(' + (rot * 0.7).toFixed(1) + 'deg)', opacity: 1, offset: 0.7 },
          { transform: 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(1.1) rotate(' + rot.toFixed(1) + 'deg)', opacity: 0 }
        ], { duration: dur, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
        a.onfinish = function(){ node.remove(); };
      })(el);
    }
  }

  // Ambient sky. Reduced motion thins it out and slows it down instead of emptying it:
  // the drifting hearts were missing entirely on the user's phone because this used to
  // return early whenever the phone asked for less motion.
  var spawner = null;
  function startSky(){
    var seedCount = calm ? 8 : 14;
    var cap = calm ? 16 : 34;
    for (var i = 0; i < seedCount; i++) makeHeart(true);
    if (spawner) clearInterval(spawner);
    spawner = setInterval(function(){
      if (document.hidden) return;
      if (sky.querySelectorAll('.float-heart').length < cap) makeHeart(false);
    }, calm ? 1800 : 900);
  }
  function startSparks(){
    var n = calm ? 12 : 20;
    for (var s = 0; s < n; s++) makeSpark();
  }

  // Measure before choosing an engine. Reduce Motion, Low Power Mode and older WebKit
  // builds can each leave an animation sitting at its first frame, and a sky frozen like
  // that is exactly what the user saw, so the page checks that an animation really
  // advances on this device before relying on one.
  function probe(done){
    if (forceFrames || !canAnimate) return done(false);
    var p = document.createElement('span');
    p.setAttribute('aria-hidden', 'true');
    p.style.cssText = 'position:fixed;left:-9999px;top:0;width:4px;height:4px;pointer-events:none';
    document.body.appendChild(p);
    var a;
    try {
      a = p.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 4000, iterations: Infinity });
    } catch (e) {
      p.parentNode.removeChild(p);
      return done(false);
    }
    setTimeout(function(){
      try { probeMs = Number(a.currentTime) || 0; } catch (e) { probeMs = 0; }
      try { probeState = a.playState; } catch (e) { probeState = 'unknown'; }
      try { a.cancel(); } catch (e) {}
      if (p.parentNode) p.parentNode.removeChild(p);
      done(probeMs > 0 && probeState !== 'idle');
    }, 260);
  }

  probe(function(ok){
    useFrames = !ok;
    engine = ok ? 'web-animations' : 'frame-loop';
    startSky();
    startSparks();
  });

  // A safety net, not a fix for a known browser bug: each node is normally removed by
  // its own onfinish. This keeps the two layers from growing without bound if a finish
  // event is ever missed, for instance on a page left open for days or a tab frozen
  // mid-animation. It only removes nodes whose animations have all finished, and sparks
  // run with iterations: Infinity, so they never read as finished and are left alone.
  function sweepFinished(root, selector){
    var nodes = root.querySelectorAll(selector);
    for (var i = 0; i < nodes.length; i++){
      var node = nodes[i];
      if (!node.getAnimations) continue;
      var list = node.getAnimations();
      if (!list.length) continue;
      var done = true;
      for (var j = 0; j < list.length; j++){
        if (list[j].playState !== 'finished'){ done = false; break; }
      }
      if (!done) continue;
      for (var k = 0; k < list.length; k++) list[k].cancel();
      node.remove();
    }
  }
  setInterval(function(){
    if (document.hidden) return;
    sweepFinished(sky, '.float-heart');
    sweepFinished(burst, '.pop');
  }, 2000);

  // Rebuild the ambient layer after a rotation, so positions match the new viewport.
  // Safari on iOS fires resize every time the address bar collapses or expands while
  // scrolling, so only a width change counts — otherwise an ordinary scroll would wipe
  // every drifting heart mid-flight and restart the sky.
  var resizeTimer = null;
  var lastW = window.innerWidth;
  window.addEventListener('resize', function(){
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      // Cancel first: clearing the container leaves infinite spark animations running
      // on detached nodes, which would pile up on every rotation.
      var nodes = sky.querySelectorAll('.float-heart,.spark');
      for (var i = 0; i < nodes.length; i++){
        if (nodes[i].getAnimations){
          var list = nodes[i].getAnimations();
          for (var j = 0; j < list.length; j++) list[j].cancel();
        }
      }
      sky.textContent = '';
      startSky();
      startSparks();
    }, 350);
  });

  // ---- Music: a small music box, synthesised in the browser. -------------------------
  // iOS blocks sound until the user taps something, so the audio context is created in the
  // tap handler. navigator.audioSession lets Safari play it even with the ringer switch off.
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, sched = null;
  var playing = false, bar = 0, nextBarAt = 0;

  var BPM = 92, BEAT = 60 / BPM, BAR = BEAT * 4, VOLUME = 0.16;
  var CHORDS = [
    { bass: 130.81, arp: [261.63, 392.00, 523.25, 659.25] }, // C
    { bass: 98.00,  arp: [196.00, 293.66, 392.00, 493.88] }, // G
    { bass: 110.00, arp: [220.00, 329.63, 440.00, 523.25] }, // Am
    { bass: 87.31,  arp: [174.61, 261.63, 349.23, 440.00] }  // F
  ];
  var ARP_PATTERN = [0, 1, 2, 3, 2, 1, 2, 3];
  var MELODY = [
    [[0, 783.99, 0.9], [1, 659.25, 0.6], [2, 523.25, 1.4]],
    [[0, 587.33, 0.9], [1, 493.88, 0.6], [2, 392.00, 1.4]],
    [[0, 523.25, 0.9], [1, 659.25, 0.6], [2, 440.00, 1.4]],
    [[0, 698.46, 0.7], [1.5, 659.25, 0.5], [2, 587.33, 0.7], [3, 523.25, 1.1]]
  ];

  function note(freq, at, dur, vol, type){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    var filt = ctx.createBiquadFilter();
    osc.type = type || 'triangle';
    osc.frequency.value = freq;
    filt.type = 'lowpass';
    filt.frequency.value = Math.min(7000, freq * 7);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), at + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(filt); filt.connect(gain); gain.connect(master);
    osc.start(at);
    osc.stop(at + dur + 0.06);
  }

  function scheduleBar(at, index){
    var chord = CHORDS[index % CHORDS.length];
    note(chord.bass, at, BAR * 0.95, 0.09, 'sine');
    for (var i = 0; i < ARP_PATTERN.length; i++){
      var t = at + i * (BEAT / 2);
      note(chord.arp[ARP_PATTERN[i]], t, 0.55, 0.055 + Math.random() * 0.015, 'triangle');
    }
    var phrase = MELODY[index % MELODY.length];
    for (var m = 0; m < phrase.length; m++){
      var n = phrase[m];
      note(n[1], at + n[0] * BEAT, n[2], 0.085, 'sine');
      note(n[1] * 2, at + n[0] * BEAT, n[2] * 0.5, 0.018, 'triangle');
    }
  }

  function tick(){
    if (!ctx || !playing || ctx.state !== 'running') return;
    while (nextBarAt < ctx.currentTime + 0.6){
      scheduleBar(nextBarAt, bar);
      bar++;
      nextBarAt += BAR;
    }
  }

  function initAudio(){
    if (ctx) return true;
    if (!AC) return false;
    try {
      ctx = new AC();
    } catch (e) { return false; }
    // iOS routes raw Web Audio through the 'ambient' session, which the ring/silent
    // switch mutes. navigator.audioSession fixes that, but only from iOS 16.4 — on
    // older iPhones say so instead of playing to nobody.
    if (navigator.audioSession) {
      try { navigator.audioSession.type = 'playback'; } catch (e) {}
    } else if (hintEl) {
      hintEl.textContent = 'Tryck på hjärtat. Hör du ingen musik? Kolla ljudknappen på sidan av telefonen.';
    }
    master = ctx.createGain();
    master.gain.value = 0.0001;
    var delay = ctx.createDelay(1);
    delay.delayTime.value = 0.28;
    var feedback = ctx.createGain();
    feedback.gain.value = 0.26;
    var wet = ctx.createGain();
    wet.gain.value = 0.28;
    master.connect(ctx.destination);
    master.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wet);
    wet.connect(ctx.destination);
    return true;
  }

  // WebKit also parks a context in a non-standard 'interrupted' state after a call,
  // Siri, an alarm or another app taking the audio session, so anything that is not
  // 'running' needs waking, not just 'suspended'. resume() can throw there as well.
  function wake(){
    if (!ctx || !ctx.resume) return;
    if (ctx.state !== 'running'){
      try {
        var p = ctx.resume();
        if (p && p.catch) p.catch(function(){});
      } catch (e) {}
    }
  }

  function fadeTo(value, seconds){
    var now = ctx.currentTime;
    var current = Math.max(0.0001, master.gain.value);
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(current, now);
    master.gain.linearRampToValueAtTime(Math.max(0.0001, value), now + seconds);
  }

  function setMusic(on){
    playing = on;
    musicBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    musicLabel.textContent = on ? 'pausa musik' : 'spela musik';
  }

  musicBtn.addEventListener('click', function(){
    if (!initAudio()){
      musicLabel.textContent = 'musik stöds ej';
      musicBtn.disabled = true;
      return;
    }
    wake();

    if (playing){
      setMusic(false);
      fadeTo(0.0001, 0.6);
      if (sched) { clearInterval(sched); sched = null; }
      return;
    }

    setMusic(true);
    // Pausing leaves up to a few seconds of notes already scheduled; starting again
    // from the current time would play a second copy on top of them, out of phase.
    nextBarAt = Math.max(nextBarAt, ctx.currentTime + 0.12);
    tick();
    fadeTo(VOLUME, 1.2);
    if (sched) clearInterval(sched);
    sched = setInterval(tick, 120);
  });

  // A short chime on the heart, but only once the music is already running.
  function chime(){
    if (!ctx || !playing || ctx.state !== 'running') return;
    var at = ctx.currentTime + 0.01;
    var notes = [1046.50, 1318.51, 1567.98];
    for (var i = 0; i < notes.length; i++){
      note(notes[i], at + i * 0.07, 0.45, 0.07, 'sine');
    }
  }

  document.addEventListener('visibilitychange', function(){
    if (!ctx) return;
    if (document.hidden){
      if (playing && ctx.suspend) ctx.suspend();
      return;
    }
    if (!playing) return;
    wake();
    // Do not trust resume()'s promise or ctx.state on iOS: both can report success
    // while the clock stays frozen. Check whether time actually moved instead.
    var before = ctx.currentTime;
    setTimeout(function(){
      if (!playing || document.hidden) return;
      if (ctx.currentTime > before){
        nextBarAt = Math.max(nextBarAt, ctx.currentTime + 0.1);
        return;
      }
      // Still frozen: hand control back so the next tap restarts inside a real gesture.
      if (sched){ clearInterval(sched); sched = null; }
      master.gain.cancelScheduledValues(0);
      master.gain.value = 0.0001;
      setMusic(false);
    }, 400);
  });

  // ---- Heart ------------------------------------------------------------------------
  // Requested: make the animation work in Safari on iPhone. The beat stays a CSS
  // animation, because that one runs on the compositor and costs the battery least, but
  // the page now checks that it is actually moving instead of assuming it. It samples
  // the rendered transform three times across one cycle; the beat rests at scale(1) for
  // about 0.6s of its 1.6s, so two samples can legitimately match while three cannot.
  // If nothing moved, the frame loop takes the beat and the glow over.
  var heartSvg = heart.querySelector('svg');
  var glowEl = document.querySelector('.heart-wrap .glow');
  var heartWrap = document.querySelector('.heart-wrap');
  var beatByFrames = false;

  function beatScale(k){
    if (calm) return 1 + 0.035 * smooth(k < 0.5 ? k * 2 : (1 - k) * 2);
    if (k < 0.14) return 1 + 0.09 * smooth(k / 0.14);
    if (k < 0.28) return 1 + 0.09 * smooth(1 - (k - 0.14) / 0.14);
    if (k < 0.42) return 1 + 0.05 * smooth((k - 0.28) / 0.14);
    if (k < 0.60) return 1 + 0.05 * smooth(1 - (k - 0.42) / 0.18);
    return 1;
  }

  function startBeatByFrames(){
    if (beatByFrames || !heartSvg) return;
    beatByFrames = true;
    // Clear the CSS animation first: a paused animation still asserts its own transform,
    // and that would win over an inline style.
    heartSvg.style.animation = 'none';
    if (glowEl) glowEl.style.animation = 'none';
    var period = calm ? 3200 : 1600;
    addJob(function(now){
      var k = (now % period) / period;
      heartSvg.style.transform = 'scale(' + beatScale(k).toFixed(4) + ')';
      if (glowEl){
        var g = smooth(k < 0.3 ? k / 0.3 : (1 - k) / 0.7);
        glowEl.style.opacity = ((calm ? 0.52 : 0.5) + (calm ? 0.26 : 0.45) * g).toFixed(3);
        glowEl.style.transform = 'scale(' + ((calm ? 0.99 : 0.96) + (calm ? 0.03 : 0.1) * g).toFixed(3) + ')';
      }
      return true;
    });
  }

  function watchBeat(){
    if (!heartSvg) return;
    if (forceFrames) { startBeatByFrames(); return; }
    if (!window.getComputedStyle) return;
    var seen = [], n = 0;
    (function step(){
      var value = '';
      try { value = window.getComputedStyle(heartSvg).transform || ''; } catch (e) { return; }
      seen.push(value);
      if (++n < 3){ setTimeout(step, 420); return; }
      if (seen[0] === seen[1] && seen[1] === seen[2]) startBeatByFrames();
    })();
  }
  // Plain timers, deliberately: gating this on requestAnimationFrame would mean the check
  // never runs in the one case it is for, a browser that has stopped delivering frames.
  setTimeout(watchBeat, 150);

  // The press state is set from events rather than :active, which iOS can leave stuck on
  // an element after a tap.
  function press(on){
    if (!heartWrap) return;
    if (on) heartWrap.className = 'heart-wrap pressing';
    else heartWrap.className = 'heart-wrap';
  }
  if (window.PointerEvent){
    heart.addEventListener('pointerdown', function(){ press(true); });
    heart.addEventListener('pointerup', function(){ press(false); });
    heart.addEventListener('pointercancel', function(){ press(false); });
    heart.addEventListener('pointerleave', function(){ press(false); });
  } else {
    heart.addEventListener('touchstart', function(){ press(true); });
    heart.addEventListener('touchend', function(){ press(false); });
    heart.addEventListener('touchcancel', function(){ press(false); });
    heart.addEventListener('mousedown', function(){ press(true); });
    heart.addEventListener('mouseup', function(){ press(false); });
  }
  window.addEventListener('blur', function(){ press(false); });

  var LINES = [
    'Du gör helt vanliga dagar fina bara genom att finnas.',
    'Finaste leendet, finaste skrattet, finaste du.',
    'Jag blir glad av dig varje dag, Saranda.',
    'Du är min favoritmänniska.',
    'Tack för att du är precis som du är.',
    'Och ja, du är fortfarande bäst.'
  ];
  var li = 0;
  var kisses = 0;
  var swapTimer = null;

  heart.addEventListener('click', function(){
    var r = heart.getBoundingClientRect();
    popHearts(r.left + r.width / 2, r.top + r.height / 2);
    chime();
    kisses += 1;
    countEl.textContent = kisses;
    // One fade at a time, and the line advances only when a fade really renders, so
    // fast tapping cannot cut a fade short or skip past a message unseen.
    if (!swapTimer){
      line.classList.add('swap');
      swapTimer = setTimeout(function(){
        li = (li + 1) % LINES.length;
        line.textContent = LINES[li];
        line.classList.remove('swap');
        swapTimer = null;
      }, 280);
    }
  });

  // ---- Device report -----------------------------------------------------------------
  // Hidden unless the page is opened with ?debug=1 on the end of the address. It exists
  // because the iPhone problem could not be reproduced here: if anything still does not
  // move, this says what the phone is actually doing instead of leaving us guessing.
  if (window.location.search.indexOf('debug=1') > -1){
    var panel = document.createElement('div');
    panel.setAttribute('aria-hidden', 'true');
    panel.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;max-width:92vw;' +
      'max-height:62vh;overflow:auto;padding:10px 12px;border-radius:12px;' +
      'background:rgba(0,0,0,.82);color:#fff;font:11px/1.5 ui-monospace,Menlo,monospace;' +
      'white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text';
    document.body.appendChild(panel);

    var render = function(){
      var cssTransform = 'n/a', timeline = 'n/a';
      try { cssTransform = window.getComputedStyle(heartSvg).transform; } catch (e) {}
      try { timeline = Math.round(Number(document.timeline.currentTime)); } catch (e) {}
      panel.textContent = [
        'engine          ' + engine,
        'reduce motion   ' + calm,
        'element.animate ' + canAnimate,
        'probe time      ' + probeMs + ' ms (' + probeState + ')',
        'beat            ' + (beatByFrames ? 'frame loop' : 'css animation'),
        'heart transform ' + cssTransform,
        'doc timeline    ' + timeline,
        'hearts / sparks ' + sky.querySelectorAll('.float-heart').length + ' / ' +
                             sky.querySelectorAll('.spark').length,
        'frame jobs      ' + frameJobs.length,
        'audio           ' + (ctx ? ctx.state : 'not started') +
                             (navigator.audioSession ? ' (audioSession)' : ''),
        'viewport        ' + window.innerWidth + 'x' + window.innerHeight +
                             ' @' + (window.devicePixelRatio || 1),
        'ua              ' + navigator.userAgent
      ].join('\n');
    };
    render();
    setInterval(render, 1000);
  }
})();
</script>
</body>
</html>
